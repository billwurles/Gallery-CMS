events {
    worker_connections 1024;  # This specifies the maximum number of simultaneous connections
}

http {
    # Real content types (text/css, application/javascript, image/jpeg...) instead of text/plain for all
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    #Compression to speed stuff up
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml text/xml application/xml+rss;
    gzip_min_length 1000;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # The published site can live under a path prefix (SITE_BASE_PATH, e.g. /gallery-cms behind
        # the reverse proxy; empty at the root). Its links carry the prefix, so strip it here: the same
        # files then work at /<prefix>/ through the proxy and at / on the LAN port.
        # This file is an nginx-image template: ${SITE_BASE_PATH} is filled in from the environment.
        absolute_redirect off;
        rewrite ^${SITE_BASE_PATH}$ ${SITE_BASE_PATH}/ permanent;
        rewrite ^${SITE_BASE_PATH}/(.*)$ /$1 last;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;  # Disable directory browsing

        # By default nothing is stored: pages always come fresh, so they always link the current
        # stylesheet, scripts and images. Images and versioned CSS/JS relax this below.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;

        location / {
        }

        # Images may be kept by the browser, but it checks back each time (a 304 when unchanged), so
        # galleries aren't downloaded again on every visit.
        location ~* \.(jpe?g|png|gif|webp)$ {
            add_header Cache-Control "no-cache" always;
        }

        # Pages link the stylesheet and scripts as include/<file>?v=<content hash>: a new version gets a
        # new address, so a versioned copy can be kept for a year. Unversioned requests stay no-store.
        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            if ($arg_v) {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
        }

        # Catch all errors and redirect them to the custom 404 page
        error_page 400 401 403 404 405 408 409 410 411 412 413 414 415 416 417 418 500 502 503 504 505 /404.html;

        location = /404.html {
            internal;
        }
    }
}
