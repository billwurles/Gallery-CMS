<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} + ' - ' + ${siteName}"></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link th:href="@{/include/style.css(v=${assetVersion})}" rel="stylesheet">
    <script th:if="${pageType.equals('page') and page != null and page.showsGallery()}" th:src="@{/include/gallery.js(v=${assetVersion})}"></script>
    <script th:if="${pageType.equals('error') and errorCode != null}" th:src="@{/include/error.js(v=${assetVersion})}"></script>
</head>
<body>
    <!--/* Only in the editor's preview: says so, and links back */-->
    <div th:if="${previewEditorHome != null}"
         style="position:sticky;top:0;z-index:2000;display:flex;justify-content:center;gap:16px;padding:8px 12px;background:#1d2530;color:#fff;font:500 14px/1.4 system-ui,sans-serif">
        <span>Preview of unpublished changes</span>
        <a th:href="${previewEditorHome}" style="color:#9cc0ff">Back to the editor</a>
    </div>
    <div id="app">
        <nav
                th:replace="~{site/fragments/navigation :: navbar(menuItems=${menuItems}, currentPage=${currentPage}, siteName=${siteName})}">
        </nav>
        <section th:switch="${pageType}">
            <section th:case="'home'">
                <div th:if="${homeImage != null}"
                     th:replace="~{site/fragments/home-image :: home-image(title=${siteName}, image=${homeImage})}">
                </div>
            </section>
            <section th:case="'page'">
                <div th:if="${page != null}"
                     th:replace="~{site/fragments/content :: content(page=${page})}">
                </div>
            </section>
            <section th:case="'exhibitions'">
                <div th:if="${exhibitions != null}"
                     th:replace="~{site/fragments/exhibitions :: exhibitions(exhibitions=${exhibitions}, exhibitionPage=${exhibitionPage}, totalPages=${totalPages})}">
                </div>
            </section>
            <section th:case="'exhibition'">
                <div th:if="${exhibition != null}"
                     th:replace="~{site/fragments/exhibition :: exhibition(exhibition=${exhibition})}">
                </div>
            </section>
            <section th:case="'error'">
                <div th:if="${errorCode != null}"
                     th:replace="~{site/fragments/error :: error(code=${errorCode}, shortText=${shortText}, message=${message})}">
                </div>
            </section>
        </section>
        <footer
                th:replace="~{site/fragments/footer :: footer(currentYear=${currentYear}, name=${siteName})}">
        </footer>
    </div>
</body>
</html>
