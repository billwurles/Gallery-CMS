<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
    </head>
    <body>
        <div th:fragment="gallery(paintings, url)">
            <section th:if="${paintings}" class="grid">
                <div th:each="painting, iterStat : ${paintings}" th:key="${iterStat.index}" class="painting">
                    <!-- Image and caption display -->
                        <div th:data-id="${iterStat.index}" th:onclick="|showModal(this.dataset.id)|" style="cursor: pointer;">
                        <img th:src="@{'images/' + ${painting.filename}}"
                             th:alt="${painting.title}" />
                        <p class="caption" th:text="${painting.title}"></p>
                    </div>

                    <!-- Full-size view: the image shrinks to fit the screen, caption included -->
                    <div th:id="|modal-${iterStat.index}|" class="painting-modal" th:onclick="|closeModal(${iterStat.index}, event)|">
                        <button type="button" class="modal-close" aria-label="Close" th:onclick="|closeModal(${iterStat.index})|">Close</button>
                        <figure class="modal-content">
                            <img th:src="@{'images/' + ${painting.filename}}"
                                 th:alt="${painting.title}" />
                            <figcaption>
                                <p class="modal-title" th:text="${painting.title}"></p>
                                <p class="modal-details">
                                    <span th:if="${painting.dimensions != null and !painting.dimensions.isBlank()}" th:text="${painting.dimensions}"></span>
                                    <span th:if="${painting.medium != null and !painting.medium.isBlank()}" th:text="${painting.medium}"></span>
                                    <span th:text="${painting.sold ? 'Sold' : 'Available'}"></span>
                                </p>
                            </figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
