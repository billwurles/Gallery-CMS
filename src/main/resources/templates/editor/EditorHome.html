<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="|Editor Home - ${name}|"/>
    <th:block th:replace="~{editor/fragments/head :: common}"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js"></script>
</head>
<body>
<header th:replace="~{editor/fragments/navigation :: navbar(menuItems=${menuItems}, currentPage='')}"></header>

<main class="main">
    <div class="page-head">
        <div>
            <h1 th:text="${name}"></h1>
            <p class="sub">Changes are saved as a draft. Publish to put them on the live site.</p>
        </div>
    </div>

    <div class="home-grid">
        <section class="card">
            <div class="card-head">
                <h2>Home image</h2>
            </div>
            <img th:if="${homeImage != null}" th:src="@{/image/{f}(f=${homeImage.filename})}"
                 th:alt="${homeImage.title}" class="home-image"/>
            <a th:href="@{/upload}" class="btn btn-block">Replace image</a>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Pages</h2>
                <span class="hint">Drag to change the order of the menu</span>
                <span id="sortmsg" class="saved-note" hidden>Menu order saved</span>
            </div>
            <a class="new-row" th:href="@{/page}">+ New page</a>
            <ul class="page-list" id="sortable">
                <li class="page-row" th:each="item : ${menuItems}" th:data-id="${item.order}" th:data-url="${item.url}">
                    <span class="grip" title="Drag to reorder" aria-hidden="true"></span>
                    <a class="page-title" th:text="${item.title}"
                       th:href="@{${item.url == 'exhibitions' ? '/' + item.url : '/page/' + item.url}}"></a>
                    <span class="page-url" th:text="|/${item.url}|"></span>
                    <span class="row-actions">
                        <a class="btn btn-small"
                           th:href="@{${item.url == 'exhibitions' ? '/' + item.url : '/page/' + item.url}}">Edit</a>
                        <button type="button" class="btn btn-small btn-danger"
                                th:if="${item.url != 'exhibitions'}"
                                th:data-url="@{/page/{url}(url=${item.url})}"
                                th:data-what="|the page “${item.title}”|"
                                onclick="confirmDelete(this)">Delete</button>
                    </span>
                </li>
            </ul>
        </section>
    </div>
</main>

<script th:inline="javascript">
    $(function () {
        $("#sortable").sortable({
            handle: ".grip",
            placeholder: "sortable-placeholder",
            forcePlaceholderSize: true,
            update: function () {
                // The new menu order, as {position: page url}
                const order = {};
                $("#sortable li").each(function (index) {
                    order[index] = $(this).data("url");
                });
                $.ajax({
                    url: /*[[@{/rearrange}]]*/ '/rearrange',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(order),
                    success: function () {
                        $("#sortmsg").prop("hidden", false).stop(true, true).show().delay(3000).fadeOut();
                    },
                    error: function () {
                        flash("The menu order could not be saved", "error");
                        window.location.reload();
                    }
                });
            }
        });
    });
</script>
</body>
</html>
