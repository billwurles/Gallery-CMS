<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exhibitions</title>
    <th:block th:replace="~{editor/fragments/head :: common}"/>
</head>
<body>
<header th:replace="~{editor/fragments/navigation :: navbar(menuItems=${menuItems}, currentPage=${exhibitions.menuItem.url})}"></header>

<main class="main">
    <div class="page-head">
        <div>
            <h1>Exhibitions</h1>
            <p class="sub">Posts appear on the site newest first.</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-primary" th:href="@{/exhibitions/new}">New exhibition</a>
        </div>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(exhibitionsPage)}">No exhibitions yet.</p>

    <article th:each="exhibition : ${exhibitionsPage}" class="card post">
        <div class="post-head">
            <div>
                <h2 th:text="${exhibition.title}"></h2>
                <p class="post-date" th:text="${#dates.format(exhibition.date, 'd MMMM yyyy')}"></p>
            </div>
            <span class="row-actions">
                <a class="btn btn-small" th:href="@{/exhibitions/{url}(url=${exhibition.url})}">Edit</a>
                <button type="button" class="btn btn-small btn-danger"
                        th:data-url="@{/exhibitions/{url}(url=${exhibition.url})}"
                        th:data-what="|the exhibition “${exhibition.title}”|"
                        onclick="confirmDelete(this)">Delete</button>
            </span>
        </div>
        <div class="post-content" th:utext="${exhibition.content}"></div>
    </article>

    <nav class="pagination" th:if="${totalPages > 1}">
        <a th:if="${page > 1}" th:href="@{'?page=' + ${page - 1}}">« Previous</a>
        <span th:unless="${page > 1}" class="disabled">« Previous</span>
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a th:if="${i <= 4 or (i >= totalPages - 3) or (i >= page - 2 and i <= page + 2)}"
               th:href="@{'?page=' + ${i}}"
               th:text="${i}"
               th:classappend="${i == page ? 'active' : ''}"></a>
            <span th:if="${(i == 5 and page > 5) or (i == totalPages - 4 and page < totalPages - 4)}">…</span>
        </th:block>
        <a th:if="${page < totalPages}" th:href="@{'?page=' + ${page + 1}}">Next »</a>
        <span th:unless="${page < totalPages}" class="disabled">Next »</span>
    </nav>
</main>
</body>
</html>
