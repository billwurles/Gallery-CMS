<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- The editor's sidebar (a top bar on small screens): site name, every page, and Publish -->
<header class="sidebar" th:fragment="navbar(menuItems, currentPage)">
    <a class="brand" th:href="@{/}">
        <span class="brand-name" th:text="${siteName}">Site name</span>
        <span class="brand-sub">Site editor</span>
    </a>

    <input type="checkbox" id="toggle-menu" class="menu-toggle">
    <label for="toggle-menu" class="menu-button">Menu</label>

    <nav class="pages">
        <span class="nav-label">Pages</span>
        <a class="nav-new" th:href="@{/page}">+ New page</a>
        <a th:each="item : ${menuItems}"
           th:href="@{${item.url == 'exhibitions' ? '/' + item.url : '/page/' + item.url}}"
           th:text="${item.title}"
           th:classappend="${currentPage == item.url ? 'active' : ''}">
        </a>
    </nav>

    <div class="sidebar-actions">
        <!-- Publish stands out only when the draft differs from the live site -->
        <button type="button" class="btn" th:classappend="${publishStatus == null or publishStatus.changed} ? 'btn-publish' : 'btn-published'"
                th:data-url="@{/save}" onclick="confirmSave(this)">
            Publish site
        </button>
        <p class="publish-status" th:if="${publishStatus != null}">
            <th:block th:if="${publishStatus.changed}">
                <span class="dot dot-changed"></span>Unpublished changes
                <time th:if="${publishStatus.changedSince != null}" th:attr="datetime=${publishStatus.changedSince}"></time>
            </th:block>
            <th:block th:unless="${publishStatus.changed}">
                <span class="dot dot-live"></span>Live site is up to date
            </th:block>
            <span class="published-at" th:if="${publishStatus.lastPublished != null}">Published
                <time th:attr="datetime=${publishStatus.lastPublished}"></time></span>
        </p>
        <a class="preview-link" th:href="@{/preview}" target="_blank" rel="noopener">Preview unpublished site</a>
        <a class="preview-link" th:href="@{/backups}" th:classappend="${currentPage == 'backups'} ? 'active'">Versions</a>
    </div>
</header>
</html>
