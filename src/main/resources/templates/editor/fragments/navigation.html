<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- The editor's sidebar (a top bar on small screens): site name, every page, and Publish -->
<header class="sidebar" th:fragment="navbar(menuItems, currentPage)">
    <a class="brand" th:href="@{/}">
        <span class="brand-name" th:text="${siteName}">Site name</span>
        <span class="brand-sub">Site editor</span>
    </a>

    <input type="checkbox" id="toggle-menu" class="menu-toggle">
    <label for="toggle-menu" class="menu-button">Menu</label>

    <nav class="pages">
        <span class="nav-label">Pages</span>
        <a class="nav-new" th:href="@{/page}">+ New page</a>
        <a th:each="item : ${menuItems}"
           th:href="@{${item.url == 'exhibitions' ? '/' + item.url : '/page/' + item.url}}"
           th:text="${item.title}"
           th:classappend="${currentPage == item.url ? 'active' : ''}">
        </a>
    </nav>

    <div class="sidebar-actions">
        <button type="button" class="btn btn-publish" th:data-url="@{/save}" onclick="confirmSave(this)">
            Publish site
        </button>
    </div>
</header>
</html>
