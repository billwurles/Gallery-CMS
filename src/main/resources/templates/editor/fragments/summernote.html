<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- The rich text editor, in its standalone build (no Bootstrap) -->
    <th:block th:fragment="summernote">
        <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.js"></script>
        <script>
            // Turns #richTextEditor into the editor, loaded with the hidden content textarea
            function startRichText() {
                $('#richTextEditor').summernote({
                    minHeight: 420,
                    maxHeight: null,
                    toolbar: [
                        ['style', ['bold', 'italic', 'underline', 'clear']],
                        ['font', ['strikethrough', 'superscript', 'subscript']],
                        ['fontsize', ['fontsize']],
                        ['color', ['color']],
                        ['para', ['ul', 'ol', 'paragraph']],
                        ['table', ['table']],
                        ['insert', ['link', 'picture', 'video']],
                        ['view', ['fullscreen', 'codeview']],
                        ['height', ['height']]
                    ]
                });
                const existing = document.querySelector("textarea[name='content']").value;
                if (existing) {
                    $('#richTextEditor').summernote('code', existing);
                }
            }

            /**
             * The address field (#url): read-only, and either following source() as the fields in sources
             * change (new pages) or fixed (existing ones). "Change" unlocks it for typing; once typed in,
             * it stops following. Whatever is typed is tidied into a valid address when leaving the field.
             */
            function addressField(follows, source, sources) {
                const url = $('#url');
                let following = follows;
                sources.forEach(sel => $(sel).on('input change', () => { if (following) url.val(slugify(source())); }));
                $('#edit-url').on('click', function () {
                    url.prop('readonly', false).trigger('focus');
                    $(this).hide();
                });
                url.on('input', () => { following = false; });
                url.on('change', () => url.val(slugify(url.val())));
            }

            // "Café & Bar_2" -> "cafe-bar-2": lowercase letters, numbers and single hyphens, as the server requires
            function slugify(text) {
                return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '');
            }
        </script>
    </th:block>
</head>
</html>
