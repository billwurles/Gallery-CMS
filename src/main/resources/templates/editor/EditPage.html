<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="|Page Editor - ${page.menuItem.title == '' ? 'New Page' : page.menuItem.title}|"/>
    <th:block th:replace="~{editor/fragments/head :: common}"/>
    <th:block th:replace="~{editor/fragments/summernote :: summernote}"/>
</head>
<body>
<header th:replace="~{editor/fragments/navigation :: navbar(menuItems=${menuItems}, currentPage=${page.menuItem.url})}"></header>

<main class="main">
    <div class="page-head">
        <div>
            <p class="crumb" th:text="${newPage} ? 'New page' : 'Page'"></p>
            <h1 th:text="${page.menuItem.title == '' ? 'Untitled page' : page.menuItem.title}"></h1>
        </div>
        <div class="page-actions">
            <a th:if="${!newPage}" class="btn" th:href="@{/page/{url}/gallery(url=${page.menuItem.url})}">Edit gallery</a>
            <button type="submit" form="pageForm" class="btn btn-primary">Save page</button>
        </div>
    </div>

    <p class="notice" th:if="${newPage}">Save the page first, then add pictures to its gallery.</p>
    <p class="notice notice-error" th:if="${error}" th:text="${error}"></p>

    <form id="pageForm" class="card"
          th:action="${newPage} ? @{/page/} : @{/page/{url}/(url=${page.menuItem.url})}"
          th:object="${page}"
          method="post">
        <div class="field-pair">
            <label class="field">
                <span>Title</span>
                <input id="title" type="text" th:field="*{menuItem.title}" placeholder="Page title" required/>
            </label>
            <div class="field">
                <span>Address
                    <em th:text="${newPage} ? '(made from the title)' : '(changing it moves the page)'"></em>
                    <button type="button" class="link-button" id="edit-url">Change</button></span>
                <input id="url" type="text" th:field="*{menuItem.url}" required readonly
                       pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="100" title="Lowercase letters, numbers and single hyphens"/>
            </div>
        </div>

        <div class="field">
            <span>On the site</span>
            <div class="toggles">
                <label class="check">
                    <input type="checkbox" id="showContentBox" th:checked="${page.showContent}"/> Show text
                </label>
                <label class="check">
                    <input type="checkbox" id="showGalleryBox" th:checked="${page.showGallery}"/> Show gallery
                </label>
                <span class="hint">Hiding keeps the text or paintings, ready to show again.</span>
            </div>
            <input type="hidden" name="showContent" id="showContent" th:value="${page.showContent}"/>
            <input type="hidden" name="showGallery" id="showGallery" th:value="${page.showGallery}"/>
        </div>

        <div class="field">
            <span>Content</span>
            <!-- The hidden field must stay outside the editor's box, or it gets saved as part of the content -->
            <textarea name="content" th:field="*{content}" hidden></textarea>
            <div id="richTextEditor"></div>
        </div>
    </form>
</main>

<script th:inline="javascript">
    $(function () {
        startRichText();

        // A new page's address follows its title; an existing page keeps its address unless changed by hand
        addressField(/*[[${newPage}]]*/ true, () => $('#title').val(), ['#title']);

        $('#pageForm').on('submit', function () {
            // The controller reads plain title, url and content parameters
            $("textarea[name='content']").val($('#richTextEditor').summernote('code'));
            $('#showContent').val($('#showContentBox').prop('checked'));
            $('#showGallery').val($('#showGalleryBox').prop('checked'));
            $('#title').attr('name', 'title');
            $('#url').attr('name', 'url');
        });
    });
</script>
</body>
</html>
