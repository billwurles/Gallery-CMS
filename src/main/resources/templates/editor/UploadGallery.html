<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="|Upload - ${page}|"></title>
    <th:block th:replace="~{editor/fragments/head :: common}"/>
</head>
<body>
<header th:replace="~{editor/fragments/navigation :: navbar(menuItems=${menuItems}, currentPage=${page})}"></header>

<main class="main main-wide">
    <div class="page-head">
        <div>
            <p class="crumb">Upload</p>
            <h1 th:text="${message}"></h1>
        </div>
        <div class="page-actions">
            <button type="submit" form="metadata-form" id="upload-button" class="btn btn-primary" disabled>Upload images</button>
        </div>
    </div>

    <div id="drag-and-drop-zone" class="dropzone">
        <p><strong>Drag and drop images here</strong></p>
        <p class="hint">or</p>
        <input type="file" id="file-input" accept="image/*" multiple hidden>
        <button type="button" id="file-input-trigger" class="btn">Choose files</button>
    </div>

    <form id="metadata-form" method="post" enctype="multipart/form-data" th:action="@{upload(pageUrl=${page})}">
        <div id="preview-container" class="gallery-grid"></div>
    </form>
</main>

<script>
    const previewContainer = $('#preview-container');
    const images = [];   // base64 image data, by position
    const names = [];    // the chosen files' names, for messages (the server names saved files itself)

    function addFiles(files) {
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function (e) {
                const id = images.length;
                images.push(e.target.result.split(',')[1]);
                names.push(file.name);
                const card = $(`
                    <div class="painting" data-id="${id}">
                        <div class="painting-thumb"><img alt="Preview"></div>
                        <div class="painting-fields">
                            <label class="field"><span>Title</span><input type="text" class="f-title"></label>
                            <div class="field-pair">
                                <label class="field"><span>Dimensions</span><input type="text" class="f-dimensions"></label>
                                <label class="field"><span>Medium</span><input type="text" class="f-medium"></label>
                            </div>
                            <div class="painting-foot">
                                <label class="check"><input type="checkbox" class="f-sold"> Sold</label>
                            </div>
                        </div>
                    </div>`);
                card.find('img').attr('src', e.target.result);
                card.find('.f-title').val(file.name.replace(/\.[^/.]+$/, ''));
                previewContainer.append(card);
                $('#upload-button').prop('disabled', false);
            };
            reader.readAsDataURL(file);
        });
    }

    $('#file-input-trigger').on('click', () => $('#file-input').click());
    $('#file-input').on('change', function () {
        addFiles(this.files);
    });

    $('#drag-and-drop-zone')
        .on('dragover', function (e) {
            e.preventDefault();
            $(this).addClass('over');
        })
        .on('dragleave', function () {
            $(this).removeClass('over');
        })
        .on('drop', function (e) {
            e.preventDefault();
            $(this).removeClass('over');
            addFiles(e.originalEvent.dataTransfer.files);
        });

    $('#metadata-form').on('submit', function (e) {
        e.preventDefault();
        const uploadButton = $('#upload-button').prop('disabled', true).text('Uploading…');

        const payload = {
            images: previewContainer.find('.painting').map(function () {
                const card = $(this);
                return {
                    title: card.find('.f-title').val(),
                    filename: names[card.data('id')],
                    dimensions: card.find('.f-dimensions').val(),
                    medium: card.find('.f-medium').val(),
                    sold: card.find('.f-sold').is(':checked'),
                    order: "",
                    imageData: images[card.data('id')]
                };
            }).get()
        };

        $.ajax({
            url: $(this).attr('action'),
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function () {
                flash('Images uploaded');
                const path = window.location.pathname;
                window.location.href = path.substring(0, path.lastIndexOf('/')) || "/";
            },
            error: function (xhr) {
                // A rejected file comes back as a 400 naming it and saying why
                const reason = xhr.status === 400 && xhr.responseText ? xhr.responseText : 'the server returned an error';
                toast('Nothing was uploaded: ' + reason, 'error');
                uploadButton.prop('disabled', false).text('Upload images');
            }
        });
    });
</script>
</body>
</html>
