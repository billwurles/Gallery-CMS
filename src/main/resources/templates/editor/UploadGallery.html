<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="|Upload - ${page}|"></title>
    <th:block th:replace="~{editor/fragments/head :: common}"/>
</head>
<body>
<header th:replace="~{editor/fragments/navigation :: navbar(menuItems=${menuItems}, currentPage=${page})}"></header>

<main class="main main-wide">
    <div class="page-head">
        <div>
            <p class="crumb">Upload</p>
            <h1 th:text="${message}"></h1>
        </div>
        <div class="page-actions">
            <button type="submit" form="metadata-form" id="upload-button" class="btn btn-primary" disabled>Upload image</button>
        </div>
    </div>

    <div id="drag-and-drop-zone" class="dropzone">
        <p><strong>Drag and drop images here</strong></p>
        <p class="hint">or</p>
        <input type="file" id="file-input" accept="image/*" multiple hidden>
        <button type="button" id="file-input-trigger" class="btn">Choose files</button>
    </div>

    <form id="metadata-form" method="post" enctype="multipart/form-data" th:action="@{upload(pageUrl=${page})}">
        <div id="preview-container" class="gallery-grid"></div>
    </form>
</main>

<script th:inline="javascript">
    // Each chosen file gets a card (title, dimensions, medium, sold) and is sent on its own as a normal
    // file upload, so each has a progress bar, and one bad file doesn't stop the rest.
    const previewContainer = $('#preview-container');
    const files = [];   // the chosen File objects, by card id
    const homeImage = /*[[${page == ''}]]*/ false;

    function addFiles(list) {
        Array.from(list).forEach(file => {
            const id = files.length;
            files.push(file);
            const card = $(`
                <div class="painting" data-id="${id}">
                    <div class="painting-thumb"><img alt="Preview"></div>
                    <div class="painting-fields">
                        <label class="field"><span>Title</span><input type="text" class="f-title"></label>
                        <div class="field-pair">
                            <label class="field"><span>Dimensions</span><input type="text" class="f-dimensions"></label>
                            <label class="field"><span>Medium</span><input type="text" class="f-medium"></label>
                        </div>
                        <div class="painting-foot">
                            <label class="check"><input type="checkbox" class="f-sold"> Sold</label>
                            <button type="button" class="btn btn-small remove-file">Remove</button>
                        </div>
                        <div class="upload-progress" hidden><div class="bar"></div></div>
                        <p class="upload-message"></p>
                    </div>
                </div>`);
            card.find('img').attr('src', URL.createObjectURL(file)); // a preview without reading the file into memory
            card.find('.f-title').val(file.name.replace(/\.[^/.]+$/, ''));
            card.find('.remove-file').on('click', () => { card.remove(); updateButton(); });
            if (homeImage) card.find('.field-pair, .check').hide();
            previewContainer.append(card);
            updateButton();
        });
    }

    function updateButton() {
        const waiting = previewContainer.find('.painting:not(.done)').length;
        $('#upload-button').prop('disabled', waiting === 0)
            .text(waiting > 1 ? 'Upload ' + waiting + ' images' : 'Upload image');
    }

    $('#file-input-trigger').on('click', () => $('#file-input').click());
    $('#file-input').on('change', function () {
        addFiles(this.files);
        this.value = '';
    });
    $('#drag-and-drop-zone')
        .on('dragover', function (e) { e.preventDefault(); $(this).addClass('over'); })
        .on('dragleave', function () { $(this).removeClass('over'); })
        .on('drop', function (e) {
            e.preventDefault();
            $(this).removeClass('over');
            addFiles(e.originalEvent.dataTransfer.files);
        });

    /** Sends one card's file; resolves true if it was saved. */
    function upload(card, url) {
        const file = files[card.data('id')];
        const data = new FormData();
        data.append('file', file, file.name);
        data.append('title', card.find('.f-title').val());
        data.append('dimensions', card.find('.f-dimensions').val() || '');
        data.append('medium', card.find('.f-medium').val() || '');
        data.append('sold', card.find('.f-sold').is(':checked'));
        const progress = card.find('.upload-progress').prop('hidden', false), bar = progress.find('.bar');
        const message = card.find('.upload-message').removeClass('error').text('Uploading…');
        card.find('input, .remove-file').prop('disabled', true);
        return new Promise(resolve => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url);
            xhr.upload.onprogress = e => { if (e.lengthComputable) bar.css('width', (100 * e.loaded / e.total) + '%'); };
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    bar.css('width', '100%');
                    card.addClass('done');
                    message.text('Uploaded');
                    resolve(true);
                } else {
                    fail(xhr.status === 400 && xhr.responseText ? xhr.responseText : 'the server returned an error (' + xhr.status + ')');
                }
            };
            xhr.onerror = () => fail('the connection failed');
            xhr.send(data);
            function fail(reason) {
                progress.prop('hidden', true);
                message.addClass('error').text('Not uploaded: ' + reason);
                card.find('input, .remove-file').prop('disabled', false);
                resolve(false);
            }
        });
    }

    $('#metadata-form').on('submit', async function (e) {
        e.preventDefault();
        const url = $(this).attr('action');
        const cards = previewContainer.find('.painting:not(.done)').toArray().map(c => $(c));
        $('#upload-button').prop('disabled', true).text('Uploading…');
        // Two at a time: quicker than one by one, without flooding a slow connection
        let next = 0, failed = 0;
        async function worker() {
            while (next < cards.length) {
                const card = cards[next++];
                if (!await upload(card, url)) failed++;
            }
        }
        await Promise.all([worker(), worker()]);
        if (failed === 0) {
            flash(cards.length === 1 ? 'Image uploaded' : cards.length + ' images uploaded');
            const path = window.location.pathname;
            window.location.href = path.substring(0, path.lastIndexOf('/')) || '/';
        } else {
            toast((cards.length - failed) + ' uploaded, ' + failed + ' not: see the cards marked in red', 'error');
            updateButton();
        }
    });
</script>
</body>
</html>
