<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="|Exhibition Editor - ${exhibition.title}|"/>
    <th:block th:replace="~{editor/fragments/head :: common}"/>
    <th:block th:replace="~{editor/fragments/summernote :: summernote}"/>
</head>
<body>
<header th:replace="~{editor/fragments/navigation :: navbar(menuItems=${menuItems}, currentPage='exhibitions')}"></header>

<main class="main">
    <div class="page-head">
        <div>
            <p class="crumb"><a th:href="@{/exhibitions}">Exhibitions</a></p>
            <h1 th:text="${newExhibition} ? 'New exhibition' : ${exhibition.title}"></h1>
        </div>
        <div class="page-actions">
            <a class="btn" th:href="@{/exhibitions}">Cancel</a>
            <button type="submit" form="exhibitionForm" class="btn btn-primary">Save exhibition</button>
        </div>
    </div>

    <form id="exhibitionForm" class="card"
          th:action="${newExhibition} ? @{/exhibitions/new/save} : @{/exhibitions/{url}/save(url=${exhibition.url})}"
          th:object="${exhibition}"
          method="post">
        <div class="field-pair">
            <label class="field">
                <span>Title</span>
                <input id="title" type="text" th:field="*{title}" placeholder="Exhibition title" required/>
            </label>
            <label class="field">
                <span>Date and time</span>
                <input id="date" type="datetime-local"
                       th:value="*{#dates.format(date, 'yyyy-MM-dd''T''HH:mm')}" required/>
            </label>
        </div>
        <label class="field">
            <span>Address <em>(made from the date and title)</em></span>
            <input id="url" type="text" th:field="*{url}" required readonly>
        </label>

        <div class="field">
            <span>Content</span>
            <div id="richTextEditor">
                <textarea name="content" th:field="*{content}" style="display:none;"></textarea>
            </div>
        </div>
    </form>
</main>

<script th:inline="javascript">
    $(function () {
        startRichText();

        function generateUrl() {
            const date = $('#date').val().replace('T', ' ').replace(':', '-');
            $('#url').val(slugify(date + '-' + $('#title').val()));
        }
        $('#title').on('input', generateUrl);
        $('#date').on('change', generateUrl);

        $('#exhibitionForm').on('submit', function (event) {
            event.preventDefault();
            const exhibition = {
                url: $('#url').val(),
                title: $('#title').val(),
                date: $('#date').val(),
                content: $('#richTextEditor').summernote('code')
            };
            fetch(this.action, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(exhibition)
            })
                .then(response => {
                    if (!response.ok) throw new Error();
                    flash("Exhibition saved");
                    window.location.href = /*[[@{/exhibitions}]]*/ "/exhibitions";
                })
                .catch(() => toast("The exhibition could not be saved", "error"));
        });
    });
</script>
</body>
</html>
