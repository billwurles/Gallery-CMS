spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
gallery.root=appdata/cms/gallery/
html.root=appdata/html_root/
static.root=templates/site/static/
backup.path=appdata/cms/backup/
backup.filename=site-data-backup
num.published.backups=5
num.unpublished.backups=10
posts.per.page=7

logging.level.org.springframework=ERROR
logging.level.org.springframework.web=ERROR
logging.level.es.burl=DEBUG

management.endpoints.web.exposure.include=*

# Behind the reverse proxy: honour X-Forwarded-Prefix/Proto/Host so editor links and redirects get the prefix
server.forward-headers-strategy=framework
# Path the published static site is served under ("/" at the root, "/gallery-cms" behind the proxy)
site.base-path=/
# After each backup, delete archived images no retained backup needs, and gallery files nothing
# references once their content is archived. Set to true to only log what would be deleted.
backup.gc.dry-run=false

# Editor CSS/JS links carry a content hash (/js/scripts-<md5>.js), so a deploy always gives browsers and the
# Cloudflare edge a new address instead of letting them reuse an old copy; no-cache makes them revalidate too
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.no-cache=true
