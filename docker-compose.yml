# The site and editor are on the LAN at :6500 / :6501, and behind the proxy at
# dev.burl.es${SITE_BASE_PATH}/ or gallery-cms.burl.es (site) and
# dev.burl.es/gallery-cms-editor/ or gallery-cms-edit.burl.es (editor).
# Published links carry SITE_BASE_PATH; nginx strips it, so they work on every one of these.
# SITE_BASE_PATH is the prefix published links are built with; set it to empty to publish for the root.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "0.0.0.0:6500:80"     # public site (IPv4 only)
    environment:
      SITE_BASE_PATH: ${SITE_BASE_PATH-/gallery-cms}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./appdata/html_root:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    networks: [default, web]
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.gallery-cms.rule: Host(`gallery-cms.burl.es`) || (Host(`dev.burl.es`) && (Path(`/gallery-cms`) || PathPrefix(`/gallery-cms/`)))
      # no strip: the published links carry the prefix and nginx strips it
      traefik.http.routers.gallery-cms.middlewares: add-slash@file
      traefik.http.services.gallery-cms.loadbalancer.server.port: "80"
      developmess.title: Gallery CMS site
      developmess.description: Published gallery site
    restart: always
    depends_on:
      - cms

  cms:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:6501:8080"   # editor (IPv4 only)
    volumes:
      - ./appdata/:/appdata/
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SITE_BASEPATH: ${SITE_BASE_PATH-/gallery-cms}   # site.base-path
    networks: [default, web]
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.gallery-cms-editor.rule: Host(`gallery-cms-edit.burl.es`) || (Host(`dev.burl.es`) && (Path(`/gallery-cms-editor`) || PathPrefix(`/gallery-cms-editor/`)))
      traefik.http.routers.gallery-cms-editor.middlewares: add-slash@file,gallery-cms-editor-strip
      traefik.http.middlewares.gallery-cms-editor-strip.stripprefix.prefixes: /gallery-cms-editor
      traefik.http.services.gallery-cms-editor.loadbalancer.server.port: "8080"
      developmess.title: Gallery CMS editor
      developmess.description: Edit and publish the gallery site
    restart: always

networks:
  web:
    external: true
