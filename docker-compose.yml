services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:6500:80"   # public site
    volumes:
      - ./appdata/html_root:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    depends_on:
      - cms

  cms:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:6501:8080"  # editor (no login yet: never expose without Cloudflare Access, see SEC-1)
    volumes:
      - ./appdata/:/appdata/
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
